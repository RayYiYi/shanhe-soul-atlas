  <style>
:root {
  color-scheme:light;
  --paper:#f7f4eb; --panel:#fffcf4; --ink:#222f29; --green:#193f38;
  --muted:#60665a; --line:#d8d2c0; --red:#973f31; --red-dark:#753126;
  --gold:#b49b65;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
* { box-sizing:border-box }
html { scroll-behavior:smooth; scrollbar-gutter:stable }
body { margin:0; background:var(--paper); color:var(--ink); font:1rem/1.65 var(--sans); min-width:280px }
.wrap { width:min(1312px,calc(100% - clamp(32px,8.6vw,144px))); margin-inline:auto }
button,a,input,summary { -webkit-tap-highlight-color:transparent }
button { cursor:pointer; font:inherit; color:inherit }
a { color:inherit; text-decoration:none }
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible { outline:3px solid #b27934; outline-offset:4px }
button:disabled { cursor:default }
h1,h2,h3,p { margin:0 }
h1,h2,h3 { font-family:var(--serif); font-weight:700 }
[tabindex="-1"]:focus { outline:0 }
[hidden] { display:none!important }
.mast { border-bottom:1px solid var(--line) }
.mast-inner { min-height:78px; display:flex; align-items:center; gap:clamp(24px,4vw,66px) }
.brand { display:inline-flex; align-items:center; gap:12px; font:700 1.56rem/1 var(--serif); letter-spacing:.1em; white-space:nowrap }
.brand-seal { width:35px; height:39px; background:var(--red); color:#fff2cd; border-radius:5px 2px 5px 2px; position:relative; display:grid; align-content:center; justify-content:center; font:700 15px/.99 var(--serif); letter-spacing:0; transform:rotate(-3deg) }
.brand-seal:after { content:""; position:absolute; inset:3px; border:1px solid #f8dcab; border-radius:3px 1px 3px 1px }
nav { display:flex; align-self:stretch; gap:30px }
.nav-link { display:flex; align-items:center; position:relative; color:var(--muted); font-size:.91rem }
.nav-link.active { color:var(--red); font-weight:600 }
.nav-link.active:after { content:""; position:absolute; height:2px; background:var(--red); inset:auto 1px 0 }
.help { margin-left:auto; border:0; background:transparent; display:flex; align-items:center; gap:8px; font-size:.9rem; min-height:44px; padding:0 2px }
.help-icon { font:600 12px/16px Georgia,serif; text-align:center; width:18px; height:18px; border:1px solid currentColor; border-radius:50% }
#main { padding-top:clamp(18px,2.6vw,37px) }
.hero { position:relative; min-height:clamp(370px,32.4vw,485px); background:#173b35; color:#fffaec; display:flex; align-items:center; isolation:isolate; overflow:hidden }
.hero-paint { position:absolute; inset:0; z-index:-2; background-image:linear-gradient(90deg,#173731 0%,#173731 11%,rgba(23,55,49,.98) 22%,rgba(23,55,49,.88) 36%,rgba(23,55,49,.34) 56%,rgba(23,55,49,0) 73%),var(--landscape); background-position:center,right center; background-repeat:no-repeat; background-size:100% 100%,75% auto }
.hero-frame,.aside-frame { position:absolute; inset:12px; border:1px solid rgba(222,199,143,.45); pointer-events:none; z-index:-1 }
.hero-frame:before,.hero-frame:after { content:""; position:absolute; width:17px; height:17px; border-color:#d2ba82; border-style:solid }
.hero-frame:before { top:-1px; left:-1px; border-width:2px 0 0 2px }
.hero-frame:after { bottom:-1px; right:-1px; border-width:0 2px 2px 0 }
.hero-copy { padding:48px clamp(30px,4.1vw,70px); width:100% }
.overline,.small-kicker { display:flex; align-items:center; gap:10px; font-size:.8rem; font-weight:600; letter-spacing:.15em }
.overline { color:#e9d6a4 }
.diamond { width:9px; height:9px; border:1px solid #d8c38e; transform:rotate(45deg); position:relative; flex:none }
.diamond:after { content:""; position:absolute; inset:2px; background:#d8c38e }
.hero h1 { font-size:clamp(2.3rem,4.05vw,4.05rem); line-height:1.28; letter-spacing:.035em; margin:19px 0 13px; text-shadow:0 1px 12px #102b2266 }
.hero h1 span { color:#f2e3b8 }
.hero-desc { font-size:clamp(.94rem,1.12vw,1.05rem); color:#f0ecdf; max-width:33em; text-wrap:pretty }
.hero-action,.result-actions { display:flex; align-items:center; gap:18px; margin-top:27px }
.primary,.secondary { border:1px solid transparent; border-radius:3px; min-height:47px; padding:10px 30px; font-size:1rem; font-weight:600; letter-spacing:.05em; transition:background .18s,transform .18s }
.primary { color:#fffaf1; background:var(--red); border-color:var(--red) }
.hero .primary { background:#a74935; border-color:#ca7960; min-width:142px }
.primary:hover,.hero .primary:hover { background:var(--red-dark) }
.primary:active,.secondary:active { transform:translateY(1px) }
.primary:disabled { color:#6a6b60; background:#e3e0d5; border-color:#dad5c7 }
.hero-est { color:#e6dfce; font-size:.86rem; letter-spacing:.05em }
.art-seal { position:absolute; right:25px; bottom:26px; background:#96472e; border:1px solid #e8c391; outline:2px solid #96472e; color:#f6d6aa; writing-mode:vertical-rl; padding:3px 0; font:700 16px/1.25 var(--serif); letter-spacing:.07em }
.fact-strip { border:1px solid var(--line); border-top:0; display:flex; justify-content:space-evenly; align-items:center; min-height:78px; background:linear-gradient(90deg,#ede9db,#f4f0e4 49%,#ede9db); padding:8px 18px }
.fact-strip div { display:flex; align-items:baseline; gap:12px }
.fact-strip b { font:normal clamp(1.6rem,2.45vw,2.35rem)/1 Georgia,serif; color:var(--green); font-variant-numeric:lining-nums }
.fact-strip span { color:#4e574b; font:.9rem var(--serif); letter-spacing:.07em }

'use strict';
const AXES = ['P','S','V','N'];
const AXIS_WORDS = [
  ['即兴应变','提前谋划'], ['独处蓄能','联结他人'],
  ['体察感受','讲求实效'], ['依恋熟悉','探索新意']
];
// Rotate the combination shown in each position in balanced blocks of four.
// All four layouts retain the canonical IDs, including when answers are edited.
const DISPLAY_ORDERS = [[2,0,3,1],[1,3,0,2],[3,2,1,0],[0,1,2,3]];
const QUESTION_ORDER = [0,2,3,1,3,1,0,2];
const QUESTIONS = QUESTION_ROWS.map(([pair,title,...choices], index) => ({
  pair, title, choices,
  display: DISPLAY_ORDERS[(QUESTION_ORDER[index % 8] + Math.floor(index / 8)) % 4],
  chapter: Math.floor(index / 8)
}));
function optionSigns(choice) {
  return [choice >= 2 ? 1 : -1, choice % 2 === 1 ? 1 : -1];
}
function stableHash(answers) {
  return answers.reduce((hash,n) => Math.imul(hash ^ (n+1),16777619) >>> 0, 2166136261);
}
function scoreQuiz(answers) {
  if (!Array.isArray(answers) || answers.length !== QUESTIONS.length ||
      Array.from(answers).some(n => !Number.isInteger(n) || n < 0 || n > 3)) {
    throw new Error('请完成全部题目后再查看结果。');
  }
  const sums = AXES.map(() => 0);
  const counts = AXES.map(() => 0);
  const records = QUESTIONS.map((q,i) => {
    const signs = optionSigns(answers[i]);
    const axes = [...q.pair].map(ch => AXES.indexOf(ch));
    axes.forEach((a,j) => { sums[a] += signs[j]; counts[a]++; });
    return { i, axes, signs };
  });
  // Each axis occurs 20 times. On the -10..10 scale each result is an integer.
  const coordinates = sums.map((s,i) => 10*s/counts[i]);
  const candidates = PROFILES.map(profile => {
    const distance = coordinates.reduce((d,x,i) => d + (x-profile.vector[i])**2, 0);
    const evidence = records.map(({i,axes,signs}) => ({
      i, fit: axes.reduce((sum,a,j) => sum+profile.vector[a]*signs[j],0),
      both: axes.every((a,j) => Math.sign(profile.vector[a]) === signs[j])
    })).sort((a,b) => b.fit-a.fit || a.i-b.i);
    const bothCount = evidence.filter(e => e.both).length;
    return {profile,distance,evidence,bothCount};
  }).sort((a,b) => a.distance-b.distance || b.bothCount-a.bothCount);
  const first = candidates[0];
  const ties = candidates.filter(x => x.distance === first.distance && x.bothCount === first.bothCount);
  const chosen = ties[stableHash(answers) % ties.length];
  const matched = chosen.evidence.filter(e => e.both);
  const examples = [];
  const chapters = new Set();
  for (const e of matched) {
    const q = QUESTIONS[e.i];
    if (!chapters.has(q.chapter)) {
      examples.push({index:e.i,title:q.title,answer:q.choices[answers[e.i]]});
      chapters.add(q.chapter);
    }
    if (examples.length === 2) break;
  }
  return {profile:chosen.profile, coordinates, examples};
}
