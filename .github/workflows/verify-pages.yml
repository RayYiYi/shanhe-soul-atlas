name: Publish and verify GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/verify-pages.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-quiz-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the standalone HTML
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    outputs:
      page_url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the quiz
        id: publish
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the anonymous Pages response
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          received="$RUNNER_TEMP/quiz-from-pages.html"
          for attempt in {1..24}; do
            if curl --silent --show-error --fail --location --max-time 10 "$PAGE_URL" --output "$received" && cmp -s index.html "$received"; then
              echo "Verified public quiz at $PAGE_URL"
              exit 0
            fi
            sleep 15
          done
          echo "Public Pages response did not match the released index.html."
          exit 1
